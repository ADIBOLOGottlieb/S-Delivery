# Blueprint Render : API Laravel VOOM Delivery + base PostgreSQL.
# Render > New > Blueprint > sélectionner ce dépôt.
services:
  - type: web
    name: voom-delivery-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: VOOM Delivery
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://voom-delivery-api.onrender.com
      - key: APP_LOCALE
        value: fr
      # Emails (code « mot de passe oublié ») : SMTP gratuit, ex. Brevo (300 emails/jour).
      # Renseigner MAIL_USERNAME / MAIL_PASSWORD / MAIL_FROM_ADDRESS dans le tableau de bord Render.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: VOOM Delivery
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: voom-delivery-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Notifications push : JSON du compte de service Firebase encodé en base64 (gratuit, sans carte).
      - key: FIREBASE_CREDENTIALS
        sync: false
      # Clé des rappels livreurs (même valeur que le secret GitHub CRON_SECRET).
      - key: CRON_SECRET
        generateValue: true
    # Le disque d'une instance « free » est éphémère : captures de paiement et photos produits
    # sont perdues à chaque redéploiement. En production, passer en plan payant et ajouter :
    # disk:
    #   name: voom-storage
    #   mountPath: /var/www/html/storage/app
    #   sizeGB: 1

databases:
  - name: voom-delivery-db
    databaseName: voom_delivery
    region: frankfurt
    plan: free
