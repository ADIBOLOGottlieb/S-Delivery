name: Garder l'API éveillée

# Render (plan gratuit) met le service en veille après 15 min sans requête ;
# le réveil prend 30 à 60 s. Un appel toutes les 10 min le garde éveillé.
# GitHub peut retarder les tâches planifiées de quelques minutes : pour une garantie
# plus forte, ajouter aussi un moniteur externe (ex. cron-job.org) sur la même URL.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Appel de /up
        run: |
          curl -fsS -o /dev/null --retry 3 --retry-delay 10 --max-time 90 \
            -w "HTTP %{http_code} en %{time_total}s\n" \
            https://s-delivery-api.onrender.com/up

      # Rappels push aux livreurs (livraisons urgentes) ; même valeur que CRON_SECRET dans Render.
      - name: Rappels livreurs (secret CRON_SECRET, optionnel)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --max-time 60 -X POST -H "X-Cron-Key: $CRON_SECRET" -H "Accept: application/json" \
              https://s-delivery-api.onrender.com/api/v1/cron/run
          else
            echo "CRON_SECRET non défini : rappels non déclenchés."
          fi
