name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/**'
      - 'render.yaml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse et tests
        run: |
          flutter analyze
          flutter test

      # Notifications push : contenu de google-services.json encodé en base64 (secret facultatif).
      - name: Configuration Firebase (secret GOOGLE_SERVICES_JSON, optionnel)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "Firebase configuré."
          else
            echo "Pas de google-services.json : notifications push désactivées dans cet APK."
          fi

      # Signature release (Play Store) : keystore encodé en base64 + mots de passe (secrets facultatifs).
      # Sans ces secrets, android/app/build.gradle signe avec la clé debug : le build reste possible
      # (APK installable à la main), mais l'AAB ne sera pas accepté par Google Play.
      - name: Signature release (secrets ANDROID_KEYSTORE_*, optionnels)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
            echo "Signature release configurée."
          else
            echo "Secrets de signature absents : APK et AAB signés avec la clé debug."
          fi

      - name: Build APK release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # Format exigé par Google Play.
      - name: Build AAB release
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Renommer les fichiers
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk s-delivery.apk
          cp build/app/outputs/bundle/release/app-release.aab s-delivery.aab

      - uses: actions/upload-artifact@v7
        with:
          name: s-delivery-android
          path: |
            s-delivery.apk
            s-delivery.aab

      - name: Publier la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: S-Delivery – build ${{ github.run_number }}
          body: |
            Android de S-Delivery (commit ${{ github.sha }}).
            - s-delivery.apk : installation directe sur le téléphone.
            - s-delivery.aab : à envoyer sur la Google Play Console.
            API : https://voom-delivery-api.onrender.com/api/v1
          files: |
            s-delivery.apk
            s-delivery.aab
          make_latest: true

      - name: Nettoyage des secrets
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks android/app/google-services.json
