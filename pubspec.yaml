name: s_delivery
description: "S-Delivery — livraison de plis et colis à Lomé : suivi en direct, paiement intégré, discussion avec le livreur."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.1
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icône de l'application : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/s_delivery_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0A0A0A"
  # Icône adaptative Android : « S » lime sur fond noir.
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/images/s_delivery_icon_foreground.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/

  # Inter embarquée (aucun téléchargement au lancement, fonctionne hors connexion).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
